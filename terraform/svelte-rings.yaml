apiVersion: apps/v1
kind: Deployment
metadata:
  name: svelte-rings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svelte-rings
  template:
    metadata:
      labels:
        app: svelte-rings
    spec:
      containers:
        - name: svelte-rings
          image: greenzmey/svelte-rings:latest
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: svelte-rings
spec:
  type: NodePort
  selector:
    app: svelte-rings
  ports:
    - protocol: TCP
      port: 5000        # Service port inside cluster
      targetPort: 5000  # Container port
      nodePort: 30050   # External port on your host

