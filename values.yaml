replicaCount: 2

image:
  repository: greenzmey/svelte-rings
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: NodePort
  port: 5000
  nodePort: 31891

serviceAccount:
  create: true
  name: svelte-rings-sa

ingress:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
