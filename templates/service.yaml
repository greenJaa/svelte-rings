apiVersion: v1
kind: Service
metadata:
  name: {{ include "svelte-rings.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "svelte-rings.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
      nodePort: {{ .Values.service.nodePort }}
      name: http

